name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受 SDK 许可
        run: |
          SDKM=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin 2>/dev/null | head -1)
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: 校验 a_bogus 实现
        run: node tools/abogus-check.mjs

      - uses: gradle/actions/setup-gradle@v4

      - name: 组装 debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 组装 release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 产物清单
        run: ls -l --block-size=K app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 珊瑚抖音
          body: "commit ${{ github.sha }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          overwrite_files: true
